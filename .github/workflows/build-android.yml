name: Build Android APK (Capacitor)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.ts'
      - 'capacitor.config.ts'
      - 'scripts/**'
      - '.github/workflows/build-android.yml'

concurrency:
  group: android-apk-build
  cancel-in-progress: true

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21 (for Capacitor Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Build production web bundle (relative base ./)
        env:
          VITE_BASE_PATH: './'
        run: npm run build

      - name: Strip chat media attachments from APK bundle
        run: rm -rf dist/assets/aistudio

      - name: Initialize and sync Capacitor Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Check signing secret availability
        id: check_keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "has_secret=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secret=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore cached Android signing keystore (fallback if no GitHub Secret)
        if: steps.check_keystore.outputs.has_secret != 'true'
        uses: actions/cache@v4
        with:
          path: .keystore-cache/signing.keystore
          key: android-signing-keystore-v2

      - name: Prepare consistent Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p .keystore-cache
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > android/app/signing.keystore
            echo "Using permanent keystore from GitHub Secret ANDROID_KEYSTORE_BASE64"
          elif [ -f .keystore-cache/signing.keystore ]; then
            cp .keystore-cache/signing.keystore android/app/signing.keystore
            echo "Using cached .keystore-cache/signing.keystore (consistent APK updates enabled)"
          else
            keytool -genkeypair -v \
              -keystore .keystore-cache/signing.keystore \
              -storetype PKCS12 \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Moi Finansy,O=Personal,C=RU"
            cp .keystore-cache/signing.keystore android/app/signing.keystore
            echo "Generated initial signing keystore (will be cached for future updates)"
          fi
          ls -lh android/app/signing.keystore

      - name: Apply matching Android APK launcher, permissions, signing & version
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: node scripts/sync-android-assets.mjs

      - name: Compile Android Debug APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK signing certificate fingerprint
        run: |
          echo "=== APK Certificate Fingerprint (must match between updates) ==="
          keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep -E "Owner:|SHA256:" || true

      - name: Upload app-debug.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: moi-finansy-app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
