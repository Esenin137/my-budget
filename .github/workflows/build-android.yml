name: Build Android APK (Capacitor)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.ts'
      - 'capacitor.config.ts'
      - 'scripts/**'
      - '.github/workflows/build-android.yml'

concurrency:
  group: android-apk-build
  cancel-in-progress: true

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21 (for Capacitor Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Build production web bundle (relative base ./)
        env:
          VITE_BASE_PATH: './'
        run: npm run build

      - name: Strip chat media attachments from APK bundle
        run: rm -rf dist/assets/aistudio

      - name: Initialize and sync Capacitor Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Apply matching Android APK launcher & notification icons
        run: node scripts/sync-android-assets.mjs

      - name: Compile Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload app-debug.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: moi-finansy-app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
